<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90">
  <!-- Baseline -->
  <line x1="8" y1="76" x2="152" y2="76" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- P curve fill -->
  <path d="M 12,76 C 22,76 34,16 60,16 C 86,16 98,76 108,76 Z"
        fill="#2563eb" fill-opacity="0.10"/>
  <!-- P curve stroke -->
  <path d="M 12,76 C 22,76 34,16 60,16 C 86,16 98,76 108,76"
        fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Q curve fill -->
  <path d="M 40,76 C 50,76 62,16 88,16 C 114,16 126,76 136,76 Z"
        fill="#1e3a5f" fill-opacity="0.10"/>
  <!-- Q curve stroke -->
  <path d="M 40,76 C 50,76 62,16 88,16 C 114,16 126,76 136,76"
        fill="none" stroke="#1e3a5f" stroke-width="2.4" stroke-linecap="round"/>

  <!-- P label -->
  <text x="56" y="11" font-family="Georgia,'Times New Roman',serif"
        font-style="italic" font-size="14" fill="#2563eb" text-anchor="middle">P</text>

  <!-- Q label -->
  <text x="88" y="11" font-family="Georgia,'Times New Roman',serif"
        font-style="italic" font-size="14" fill="#1e3a5f" text-anchor="middle">Q</text>
</svg>
